services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: sisumoni
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d sisumoni"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 384m

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sisumoni
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m

  frontend:
    build: ./frontend
    restart: unless-stopped
    mem_limit: 64m

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Bootstrap: comece apontando pra default.conf.initial (só HTTP) até
      # conseguir o primeiro certificado, depois troque pra default.conf.ssl
      # e rode `docker compose restart nginx`. Veja DEPLOY.md.
      - ./nginx/default.conf.ssl:/etc/nginx/conf.d/default.conf
      - certbot_webroot:/var/www/certbot
      - letsencrypt_certs:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    mem_limit: 64m

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - letsencrypt_certs:/etc/letsencrypt
    entrypoint: sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $!; done'
    mem_limit: 128m

volumes:
  db_data:
  certbot_webroot:
  letsencrypt_certs:
