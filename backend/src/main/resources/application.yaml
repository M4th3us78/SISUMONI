spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sisumoni}
    username: ${SPRING_DATASOURCE_USERNAME:sisumoni_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sisumoni_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gerencia o schema, não o Hibernate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:smtp.resend.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:resend}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-minimo-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 horas
  admin:
    email: ${ADMIN_EMAIL:admin@sisumoni.com}
    senha: ${ADMIN_SENHA:Admin@2026!}

management:
  endpoints:
    web:
      exposure:
        include: health          # só /actuator/health exposto publicamente
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false