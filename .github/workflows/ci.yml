name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    name: Backend — build e testes (Postgres real)
    runs-on: ubuntu-latest

    # Sobe um Postgres limpo: o contexto Spring só inicia se as migrations
    # do Flyway aplicarem do zero e o schema validar contra as entidades JPA.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sisumoni
          POSTGRES_USER: sisumoni_user
          POSTGRES_PASSWORD: sisumoni_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sisumoni_user -d sisumoni"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build e testes
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sisumoni
          SPRING_DATASOURCE_USERNAME: sisumoni_user
          SPRING_DATASOURCE_PASSWORD: sisumoni_pass
          JWT_SECRET: ci-secret-apenas-para-o-pipeline-minimo-32-chars
        run: ./mvnw -B verify

      - name: Publicar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  frontend:
    name: Frontend — lint e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      # Garante que o deploy de produção continua buildável: os dois
      # Dockerfiles são multi-stage e compilam a aplicação de verdade.
      - name: Build da imagem do backend
        run: docker build -t sisumoni-backend ./backend

      - name: Build da imagem do frontend
        run: docker build -t sisumoni-frontend ./frontend
